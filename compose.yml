name: aimel

services:
  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "${AIMEL_SMTP_PORT:-1025}:1025"
      - "${AIMEL_HTTP_PORT:-8025}:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "${AIMEL_MAX_MESSAGES:-5000}"
    volumes:
      - ${AIMEL_MAIL_DIR:?run bin/aimel up so the mail database path gets set}:/data
