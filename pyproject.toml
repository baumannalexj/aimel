[project]
name = "aimel"
version = "0.1.0"
description = "Local email correspondence for AI agents"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
aimel = "application.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/adapters",
    "src/application",
    "src/common",
    "src/core",
    "src/domain",
    "src/ports",
]

# Grouped by the module that needs it, ahead of splitting into real packages.
[dependency-groups]
adapters = ["pydantic>=2.13.5"]

[tool.uv]
default-groups = ["adapters"]
